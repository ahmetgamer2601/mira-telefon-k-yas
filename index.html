    <style>
        .sticky-device-header {
            position: sticky;
            top: 64px;
            z-index: 25;
        }

            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }

        .spec-row:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.015);
        }

        .spec-row:hover {
            background-color: rgba(99, 102, 241, 0.05);
        }

        @media print {
            header, .no-print {
                display: none !important;
            }
            body {
                background: white !important;
                color: black !important;
            }
            .sticky-device-header {
                position: static !important;
            }

            </div>

        </div>

        <!-- Right Quick Actions -->

                <span class="hidden sm:inline">Favorilerim</span>
                <span id="fav-count" class="bg-amber-400/20 text-amber-300 text-xs px-1.5 py-0.5 rounded-full ml-1 font-bold">0</span>
            </button>

            <button onclick="openCustomPhoneModal()" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 transition-all flex items-center space-x-2">
                <i class="fa-solid fa-plus text-brand-500"></i>
                <span class="hidden sm:inline">Özel Cihaz Ekle</span>
                <span class="sm:hidden">Ekle</span>

            <button onclick="window.print()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 transition-all" title="Yazdır / PDF Al">
                <i class="fa-solid fa-print"></i>
            </button>

            <button onclick="shareComparison()" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-brand-600 hover:bg-brand-500 text-white shadow-lg shadow-brand-600/25 transition-all flex items-center space-x-2">
                <i class="fa-solid fa-share-nodes"></i>
                <span class="hidden sm:inline">Paylaş</span>
            </button>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main class="flex-1 max-w-[1600px] w-full mx-auto px-3 sm:px-6 py-6 flex flex-col gap-6">

        <!-- TOP CONTROLS & PRESETS -->
        <div class="bg-darkcard border border-darkborder rounded-3xl p-4 sm:p-5 shadow-xl flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4 no-print">

                </button>

                <label class="relative inline-flex items-center cursor-pointer select-none">
                    <input type="checkbox" id="toggle-highlights" checked onchange="renderComparison()" class="sr-only peer">

                        <i class="fa-solid fa-trophy text-amber-400 mr-1.5"></i> Kazananı Vurgula
                    </span>
                </label>

                <label class="relative inline-flex items-center cursor-pointer select-none">
                    <input type="checkbox" id="toggle-diff" onchange="renderComparison()" class="sr-only peer">

    <!-- MODAL: PHONE SEARCH / SELECTOR -->
    <div id="search-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 hidden no-print">
        <div class="bg-darkcard border border-darkborder w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh] animate-in fade-in zoom-in-95 duration-200">
            <div class="p-5 border-b border-darkborder flex items-center justify-between">
                <h3 class="font-bold text-lg text-white flex items-center">
                    <i class="fa-solid fa-mobile-button text-brand-500 mr-2.5"></i> Telefon Seç veya Değiştir
                </h3>
                <button onclick="closeSearchModal()" class="text-slate-400 hover:text-white transition-colors p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Search Inputs & Filters -->
            <div class="p-4 border-b border-darkborder space-y-3 bg-slate-900/50">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-500"></i>
                    <input type="text" id="phone-search-input" onkeyup="filterPhonesList()" placeholder="Marka veya model arayın (Örn: iPhone 18, S26 Ultra, Xiaomi)..." class="w-full pl-11 pr-4 py-3 bg-darkbg border border-darkborder rounded-2xl text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 font-medium placeholder-slate-500">
                </div>
                <!-- Brand Filter Pills -->

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Model Adı</label>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Tahmini Fiyat</label>

                    <div>

                    <div>

                        <input type="number" id="cust-ram" placeholder="16" class="w-full px-3.5 py-2.5 bg-darkbg border border-darkborder rounded-xl text-slate-100">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Batarya (mAh)</label>
                        <input type="number" id="cust-battery" placeholder="5500" class="w-full px-3.5 py-2.5 bg-darkbg border border-darkborder rounded-xl text-slate-100">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Ekran Boyutu & Yenileme</label>
                        <input type="text" id="cust-screen" placeholder="6.8 inç OLED 144Hz" class="w-full px-3.5 py-2.5 bg-darkbg border border-darkborder rounded-xl text-slate-100">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Ana Kamera (MP)</label>
                        <input type="text" id="cust-camera" placeholder="200 MP OIS" class="w-full px-3.5 py-2.5 bg-darkbg border border-darkborder rounded-xl text-slate-100">
                    </div>
                    <div>

                        <input type="number" id="cust-antutu" placeholder="2800000" class="w-full px-3.5 py-2.5 bg-darkbg border border-darkborder rounded-xl text-slate-100">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Şarj Hızı (W)</label>
                        <input type="number" id="cust-charge" placeholder="100" class="w-full px-3.5 py-2.5 bg-darkbg border border-darkborder rounded-xl text-slate-100">
                    </div>
                </div>
                <div class="pt-4 flex justify-end space-x-3">
                    <button type="button" onclick="closeCustomPhoneModal()" class="px-5 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-semibold hover:bg-slate-700">İptal</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-brand-600 text-white font-semibold hover:bg-brand-500 shadow-lg shadow-brand-600/20">Kaydet ve Karşılaştır</button>
                </div>
            </form>
        </div>
    </div>

        // --- 3. Core Render Engine ---
        function renderComparison() {

            const onlyDifferences = document.getElementById('toggle-diff').checked;

            for (let i = 0; i < 4; i++) {

                    const isFav = favorites.includes(phone.id);
                    html += `
                        <th class="p-4 w-64 min-w-[220px] align-top relative group border-l border-darkborder/50 bg-darkcard">
                            <div class="absolute top-3 right-3 flex items-center space-x-1.5 no-print">
                                <button onclick="toggleFavorite('${phone.id}')" class="p-1 text-slate-400 hover:text-amber-400 transition-colors" title="Favorilere Ekle">

                                </button>
                                <button onclick="removePhoneSlot(${i})" class="p-1 text-slate-500 hover:text-rose-400 transition-colors" title="Kaldır">
                                    <i class="fa-solid fa-xmark text-sm"></i>
                                </button>
                            </div>
                            
                            <div class="flex flex-col items-center text-center">
                                <div onclick="openDetailModal('${phone.id}')" class="cursor-pointer overflow-hidden rounded-2xl mb-3 border border-slate-800 bg-slate-900/80 p-2 group-hover:border-brand-500/50 transition-all">
                                    <img src="${phone.image}" alt="${phone.name}" class="h-28 w-24 object-cover rounded-xl transition-transform group-hover:scale-105">
                                </div>
                                <span class="text-[10px] font-extrabold text-brand-400 uppercase tracking-widest">${phone.brand}</span>
                                <h4 onclick="openDetailModal('${phone.id}')" class="font-bold text-sm text-white line-clamp-1 mt-0.5 hover:text-brand-400 cursor-pointer transition-colors">${phone.name}</h4>
                                <span class="text-xs font-bold text-emerald-400 mt-1">${phone.price}</span>
                                
                                <div class="mt-2.5 flex items-center justify-center space-x-1 bg-slate-800/80 px-2.5 py-1 rounded-full border border-slate-700">
                                    <i class="fa-solid fa-star text-amber-400 text-[11px]"></i>
                                    <span class="text-xs font-extrabold text-slate-200">${phone.overallScore} / 100</span>
                                </div>

                                <button onclick="openSearchModal(${i})" class="mt-2 text-[11px] text-slate-400 hover:text-white underline decoration-dashed no-print">
                                    Değiştir
                                </button>
                            </div>
                        </th>
                    `;
                } else {
                    html += `
                        <th class="p-4 w-64 min-w-[220px] align-middle text-center border-l border-darkborder/50 bg-slate-900/30 no-print">
                            <button onclick="openSearchModal(${i})" class="w-full py-8 border-2 border-dashed border-slate-700 hover:border-brand-500/60 rounded-2xl flex flex-col items-center justify-center text-slate-400 hover:text-brand-400 transition-all group">
                                <i class="fa-solid fa-plus text-2xl mb-1.5 group-hover:scale-110 transition-transform"></i>
                                <span class="text-xs font-bold">+ Cihaz Ekle</span>
                            </button>
                        </th>
                    `;
                }
            }
            html += `</tr></thead>`;

            // BODY ROWS
            html += `<tbody class="divide-y divide-darkborder">`;

            specCategories.forEach(cat => {
                html += `
                    <tr class="bg-slate-900/90">
                        <td colspan="5" class="py-3 px-4 font-bold text-xs uppercase tracking-wider text-brand-400 border-y border-darkborder">
                            ${cat.title}
                        </td>
                    </tr>
                `;

                cat.keys.forEach(spec => {
                    const phoneValues = selectedPhones.map(p => p ? p.specs[spec.key] : null);

                    if (onlyDifferences) {
                        const validDisplays = phoneValues.filter(Boolean).map(v => v.display);
                        const allSame = validDisplays.every(val => val === validDisplays[0]);
                        if (allSame && validDisplays.length > 1) return;
                    }

                    let winningIndex = -1;
                    if (showHighlights && spec.higherIsBetter !== undefined) {
                        let bestVal = spec.higherIsBetter ? -Infinity : Infinity;
                        phoneValues.forEach((valObj, idx) => {
                            if (valObj && valObj.val !== undefined && valObj.val !== null) {
                                if (spec.higherIsBetter ? (valObj.val > bestVal) : (valObj.val < bestVal)) {
                                    bestVal = valObj.val;
                                    winningIndex = idx;
                                }
                            }
                        });
                    }

                    html += `<tr class="spec-row transition-colors">`;
                    html += `<td class="py-3.5 px-4 text-xs font-bold text-slate-300 w-48 sm:w-64 border-r border-darkborder/40">${spec.label}</td>`;

                    for (let i = 0; i < 4; i++) {
                        const valObj = phoneValues[i];
                        const isWinner = (i === winningIndex);

                        if (selectedPhones[i]) {
                            html += `
                                <td class="py-3.5 px-4 text-xs text-slate-200 border-r border-darkborder/40 font-medium ${isWinner ? 'bg-emerald-500/10 text-emerald-300 font-semibold' : ''}">
                                    <div class="flex items-center justify-between">
                                        <span>${valObj ? valObj.display : '-'}</span>
                                        ${isWinner ? `<span class="bg-emerald-500/20 text-emerald-400 text-[10px] font-extrabold px-1.5 py-0.5 rounded border border-emerald-500/30 ml-1 flex items-center shrink-0"><i class="fa-solid fa-crown text-[9px] mr-1"></i> EN İYİ</span>` : ''}
                                    </div>
                                </td>
                            `;
                        } else {
                            html += `<td class="py-3.5 px-4 border-r border-darkborder/40 bg-slate-900/10 no-print"></td>`;
                        }
                    }
                    html += `</tr>`;
                });
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
            updateFavCountUI();
        }

        // --- 4. Search & Filter Modal Logic ---
        function openSearchModal(slotIndex) {
            targetSlotIndex = slotIndex;
            document.getElementById('search-modal').classList.remove('hidden');
            document.getElementById('phone-search-input').value = '';
            document.getElementById('phone-search-input').focus();
            filterBrand('Tümü');
        }

        function closeSearchModal() {
            document.getElementById('search-modal').classList.add('hidden');
        }

        function filterBrand(brand) {
            currentBrandFilter = brand;
            document.querySelectorAll('.brand-pill').forEach(btn => {
                if (btn.textContent === brand) {
                    btn.className = "brand-pill active px-3 py-1.5 rounded-xl bg-brand-600 text-white font-semibold transition-all";
                } else {
                    btn.className = "brand-pill px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all";
                }
            });
            filterPhonesList();
        }

        function filterPhonesList() {
            const query = document.getElementById('phone-search-input').value.toLowerCase();
            const listContainer = document.getElementById('phone-results-list');

            const filtered = phoneDatabase.filter(phone => {
                const matchesBrand = currentBrandFilter === 'Tümü' || phone.brand === currentBrandFilter;
                const matchesSearch = phone.name.toLowerCase().includes(query) || phone.brand.toLowerCase().includes(query);
                return matchesBrand && matchesSearch;
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="col-span-2 py-8 text-center text-slate-400 text-xs">Arama kriterlerinize uygun telefon bulunamadı.</div>`;
                return;
            }

            listContainer.innerHTML = filtered.map(phone => {
                const isAlreadySelected = selectedPhoneIds.includes(phone.id);
                return `
                    <div onclick="${isAlreadySelected ? '' : `selectPhoneForSlot('${phone.id}')`}" class="p-3 bg-darkbg border border-darkborder rounded-2xl flex items-center justify-between cursor-pointer hover:border-brand-500 transition-all ${isAlreadySelected ? 'opacity-40 cursor-not-allowed' : ''}">
                        <div class="flex items-center space-x-3">
                            <img src="${phone.image}" alt="${phone.name}" class="w-10 h-12 object-cover rounded-lg">
                            <div>
                                <span class="text-[10px] font-bold text-brand-400 uppercase">${phone.brand}</span>
                                <h5 class="text-xs font-bold text-white">${phone.name}</h5>
                                <span class="text-[11px] text-slate-400">${phone.price}</span>
                            </div>
                        </div>
                        <span class="text-xs font-semibold ${isAlreadySelected ? 'text-slate-500' : 'text-brand-400'}">
                            ${isAlreadySelected ? 'Eklendi' : '<i class="fa-solid fa-plus-circle text-lg"></i>'}
                        </span>
                    </div>
                `;
            }).join('');
        }

        function selectPhoneForSlot(phoneId) {
            if (targetSlotIndex !== null && targetSlotIndex >= 0 && targetSlotIndex < 4) {
                selectedPhoneIds[targetSlotIndex] = phoneId;
            } else {
                const emptyIdx = selectedPhoneIds.findIndex(id => id === null);
                if (emptyIdx !== -1) selectedPhoneIds[emptyIdx] = phoneId;
                else selectedPhoneIds[0] = phoneId;
            }
            closeSearchModal();
            renderComparison();
            showToast('Cihaz karşılaştırma listesine eklendi!');
        }

        function removePhoneSlot(index) {
            selectedPhoneIds[index] = null;
            renderComparison();
        }

        function resetComparison() {
            selectedPhoneIds = [null, null, null, null];
            renderComparison();
            showToast('Karşılaştırma tablosu sıfırlandı.');
        }

        function loadPreset(ids) {
            selectedPhoneIds = [null, null, null, null];
            ids.forEach((id, idx) => {
                if (idx < 4) selectedPhoneIds[idx] = id;
            });
            renderComparison();
            showToast('Hazır paket yüklendi!');
        }

        }
        function closeCustomPhoneModal() {
            document.getElementById('custom-phone-modal').classList.add('hidden');
        }

        function handleCustomPhoneSubmit(e) {
            e.preventDefault();
            const brand = document.getElementById('cust-brand').value || 'Özel';
            const name = document.getElementById('cust-name').value || 'Yeni Cihaz';
            const price = document.getElementById('cust-price').value || '₺0';
            const chipset = document.getElementById('cust-chipset').value || 'Bilinmiyor';
            const ram = parseInt(document.getElementById('cust-ram').value) || 12;
            const battery = parseInt(document.getElementById('cust-battery').value) || 5000;
            const screen = document.getElementById('cust-screen').value || '6.7 inç OLED';
            const camera = document.getElementById('cust-camera').value || '50 MP';
            const antutu = parseInt(document.getElementById('cust-antutu').value) || 2000000;
            const charge = parseInt(document.getElementById('cust-charge').value) || 60;

            const customId = 'custom-' + Date.now();
            const newPhone = {
                id: customId,
                brand: brand,
                name: name,
                price: price,
                releaseDate: '2026',
                image: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400&auto=format&fit=crop&q=80',
                overallScore: 90,
                pros: ['Özel Eklenen Cihaz Verisi'],
                cons: ['Deneysel Veri'],
                specs: {
                    weight: { val: 200, display: '200 gram' },
                    thickness: { val: 8.0, display: '8.0 mm' },
                    build: { display: 'Alüminyum & Cam' },
                    ipRating: { display: 'IP68' },
                    screenSize: { val: 6.7, display: screen },
                    refreshRate: { val: 120, display: '120Hz' },
                    peakBrightness: { val: 2500, display: '2500 nits' },
                    chipset: { display: chipset },
                    ram: { val: ram, display: `${ram} GB` },
                    storage: { display: '256 GB / 512 GB' },
                    antutu: { val: antutu, display: `${antutu.toLocaleString('tr-TR')}` },
                    mainCamera: { display: camera },
                    telephoto: { display: 'Var' },
                    ultrawide: { display: '12 MP' },
                    frontCamera: { display: '16 MP' },
                    dxomark: { val: 145, display: '145 Puan' },
                    battery: { val: battery, display: `${battery} mAh` },
                    chargingSpeed: { val: charge, display: `${charge}W Hızlı Şarj` },
                    wirelessCharging: { val: 15, display: '15W Wireless' },
                    os: { display: 'Android 16' },
                    updateSupport: { val: 4, display: '4 Yıl' },
                    connectivity: { display: 'Wi-Fi 7, Bluetooth 5.4, 5G' }
                }
            };

            phoneDatabase.unshift(newPhone);
            selectPhoneForSlot(customId);
            closeCustomPhoneModal();
            showToast('Özel cihaz oluşturuldu ve karşılaştırmaya eklendi!');
        }

        // --- 7. Favorites & Utilities ---
        function toggleFavorite(phoneId) {
            const idx = favorites.indexOf(phoneId);
            if (idx > -1) {
                favorites.splice(idx, 1);
                showToast('Favorilerden çıkarıldı.');
            } else {
                favorites.push(phoneId);
                showToast('Favorilere eklendi!');
            }
            localStorage.setItem('teleKiyas_favorites', JSON.stringify(favorites));
            renderComparison();
        }

        function toggleFavoritesView() {
            if (favorites.length === 0) {
                showToast('Henüz favori cihaz eklemediniz.');
                return;
            }
            loadPreset(favorites);
            showToast('Favori cihazlarınız yüklendi!');
        }

        function updateFavCountUI() {
            const el = document.getElementById('fav-count');
            if (el) el.textContent = favorites.length;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = message;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3000);
        }

        function shareComparison() {
            const active = selectedPhoneIds.filter(Boolean);
            if (navigator.clipboard) {
                navigator.clipboard.writeText(window.location.href);
            }
            showToast(`Karşılaştırma adresi kopyalandı! (${active.length} cihaz)`);
        }

        // --- Initialize ---
        window.onload = function() {
            renderComparison();
        };
    </script>
</body>
</html>
